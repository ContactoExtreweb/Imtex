[build]
  command = "npm run build"
  publish = "dist"
  # No construir si esta app no ha cambiado (cada deploy a producción gasta créditos)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "24"

# Cabeceras de seguridad básicas (sin CSP: el 3D y las transiciones usan scripts en línea)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Los archivos de /_astro llevan una huella en el nombre: si cambian, cambia el nombre
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
