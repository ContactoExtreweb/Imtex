<!doctype html>
<!-- Imagen para compartir la web (og:image, 1200 × 630). La fotografía scripts/imagen-compartir.mjs.
     Foto: Central Nuclear de Almaraz, membrana de poliurea (src/assets/fases/5-membrana.jpg, de la web antigua de IMTEX). -->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Archivo';
        src: url('../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2') format('woff2');
        font-weight: 100 900;
        font-stretch: 62% 125%;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background: #131116;
        color: #f0f1f3;
        font-family: 'Archivo', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .texto {
        position: absolute;
        left: 72px;
        top: 62px;
        width: 596px;
      }
      .logo {
        display: block;
        width: 300px;
      }
      h1 {
        margin-top: 40px;
        font-stretch: 62%;
        font-weight: 800;
        font-size: 61px;
        line-height: 0.94;
        text-transform: uppercase;
      }
      .apoyo {
        margin-top: 22px;
        font-size: 22px;
        line-height: 1.3;
        color: #a9aebb;
      }
      .foto {
        position: absolute;
        top: 0;
        right: 0;
        width: 520px;
        height: 630px;
        object-fit: cover;
        object-position: 58% 50%;
      }
      /* El filete rojo que separa, como la línea de las portadillas */
      .filete {
        position: absolute;
        top: 0;
        left: 680px;
        width: 6px;
        height: 630px;
        background: #ff311e;
      }
      .pie {
        position: absolute;
        left: 686px;
        bottom: 0;
        background: #131116;
        padding: 10px 16px 11px;
        font-stretch: 75%;
        font-weight: 600;
        font-size: 17px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #eef0f2;
      }
      .lema {
        position: absolute;
        left: 40px;
        bottom: 58px;
        width: 620px;
      }
    </style>
  </head>
  <body>
    <div class="texto">
      <img class="logo" src="../src/assets/logo-imtex-claro.png" alt="" />
      <h1>Impermeabilización, reparación y refuerzo de estructuras</h1>
      <p class="apoyo">Más de 25 años en obra · Villanueva de la Serena (Badajoz)</p>
    </div>
    <img class="lema" src="../src/assets/lema-imtex.png" alt="" />
    <img class="foto" src="../src/assets/fases/5-membrana.jpg" alt="" />
    <div class="filete"></div>
    <p class="pie">Central Nuclear de Almaraz · poliurea</p>
  </body>
</html>
