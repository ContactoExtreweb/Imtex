<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Instalable en el móvil («Añadir a pantalla de inicio»): abre a pantalla completa, sin la barra del navegador -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="IMTEX" />
    <meta name="theme-color" content="#131116" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMTEX · Gestión</title>
    <script>
      // Enlaces de invitación o recuperación (también los del panel de Supabase, que van a la raíz):
      // a la pantalla de elegir contraseña, conservando el token del hash.
      if (/type=(invite|recovery)|error_code=/.test(location.hash) && location.pathname !== '/nueva-contrasena')
        history.replaceState(null, '', '/nueva-contrasena' + location.hash)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
